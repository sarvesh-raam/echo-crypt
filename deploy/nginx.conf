# Round-robin load balancer in front of the API instances.
# Clients use the WebSocket transport only, so no sticky sessions are required:
# each socket lives on one instance, and Redis Pub/Sub moves events between them.
upstream echocrypt {
  server api1:4000;
  server api2:4000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 64k;

  location / {
    proxy_pass http://echocrypt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host; # keeps the port: passkeys check the exact origin
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }
}
